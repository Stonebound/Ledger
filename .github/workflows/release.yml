name: Release

on:
    release:
        types: [published]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: 25
                  distribution: 'temurin'

            - name: Build release
              run: ./gradlew build

            - name: Run end-to-end tests
              run: ./gradlew :neoforge:runGameTests :fabric:runGameTests

            # GitHub only: this fork must not publish to upstream's Modrinth and CurseForge projects.
            - name: Upload assets to the GitHub release
              uses: softprops/action-gh-release@v2
              with:
                files: |
                  neoforge/build/libs/ledger-neoforge-*[0-9].jar
                  fabric/build/libs/ledger-*[0-9].jar
