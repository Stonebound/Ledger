modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0"
issueTrackerURL = "https://github.com/Stonebound/Ledger/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "Potatoboy9999"
logoFile = "assets/ledger/icon.png"
description = "Logs world events and allows for them to be rolled back. Unofficial NeoForge port."

[[mixins]]
config = "ledger.mixins.json"

[[mixins]]
config = "ledger.neoforge.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2,)"
ordering = "NONE"
side = "SERVER"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft},26.2)"
ordering = "NONE"
side = "SERVER"

[[dependencies.${id}]]
modId = "kotlinforforge"
type = "required"
versionRange = "[6.4.0,)"
ordering = "NONE"
side = "SERVER"
